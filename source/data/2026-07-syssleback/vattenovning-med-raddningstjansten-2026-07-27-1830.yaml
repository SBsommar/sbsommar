  title: Vattenövning med räddningstjänsten
  date: '2026-07-27'
  start: '18:30'
  end: '20:00'
  location: Grillplats
  responsible: Mamma Mia
  description: |
    Räddningstjänsten kommer hit med sin brandbil, tankbil och kanske nåt mer fordon och vi får vara med på övning.
    Testa att spruta vatten, ca 400 liter per minut!
    Passa på att träffa brandmän, provsitta brandbilen, ställa tusen frågor.
    Vi är vid grillplatsen vid älven.
    Barn och vuxna får vara med och leka brandman! Bara fantasin och säkerheten sätt gränser för vad vi hittar på ihop.
    Ifall de måste åka på larm, så blir det tyvärr inställt.
    
