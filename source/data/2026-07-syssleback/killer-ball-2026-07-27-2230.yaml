  description: |
    **Killerball** (även kallat **killerboll**) är en bolllek som liknar spökboll, men spelas oftast utan lag. Spelet är vanligt i svenska skolor och på idrottslektioner. 
    
    Vanliga regler är:
    
    * Alla spelare rör sig fritt inom spelområdet.
    * En mjuk boll används för att träffa andra spelare.
    * Blir du träffad av bollen direkt (utan att den först studsat i golvet eller väggen) är du ute.
    * Om du fångar bollen innan den träffar marken är du kvar i spelet, och i vissa regelvarianter blir kastaren i stället ute.
    * Den sista spelaren som är kvar vinner. 
    
    Reglerna kan variera mellan skolor. Ofta finns också säkerhetsregler, till exempel att kast mot huvudet inte räknas eller inte är tillåtna.
