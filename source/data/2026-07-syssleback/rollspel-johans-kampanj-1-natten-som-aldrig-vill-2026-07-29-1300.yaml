  description: |
    
    Ser det inte ut som du tänkt dig? Kolla Markdown-guiden ↗
    Vi kommer att använda spelsystemet från nya Drakar och Demoner, men förhålla oss lite fritt till både världen och regler. Det finns alltid platts för fantasi, egna idéer och förslag, så länge det inte stjälper spelet! För att få lite starkare karaktärer så kommer rollpersonerna få tre (3) extra tränade färdigheter från början. För magiker kan det bytas ut mot tre besvärjelser eller ytterligare en magiskola och två besvärjelser. Besvärjelserna kan också vara på en högre nivå.
    
    Äventyret kommer äga rum i en värld där samhället håller på att tappa greppet, där naturen och dolda krafter håller på att ta över. Resorna till lands och till sjöss kan bli långa. Strid och magi kan behövas på oväntade platser, men lalla hinder går inte att övervinna, så det finns alltid platts för list, övertalning och reträtt.
    
    För er som kommer sent kommer det finnas möjlighet att göra karaktärer innan spelet drar i gång på måndag kväll. Att göra karaktärer till Drakar och Demoner går rätt fort, och inlevelse slår alltid siffror.
