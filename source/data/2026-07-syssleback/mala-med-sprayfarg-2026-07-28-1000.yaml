event:
  id: mala-med-sprayfarg-2026-07-28-1000
  title: Måla med sprayfärg drop in
  date: '2026-07-28'
  start: '10:00'
  end: '12:00'
  location: Fotbollsplan
  responsible: Eila och Jonas Colling
  description: |
    Testa att måla med sprayfärg eller skapa ditt livs grafittikonstverk. Vi har färger, kartongskivor och skyddsutrustning för mun och ögon, du har oömma kläder och vill prova hur det funkar. Man kan vända kläder ut och in för att dölja fläckar eller klippa till en sopsäck att ha som förekläde. Vi ger lite tips och tricks men inte så mycket konstnärlig handledning som istället möjlighet att prova på mediet och uttrycka sig fritt.
    
    Platsen är beroende av vind och väder, vid regn eller stark vind ställer vi in och kör ett nytt tillfälle senare. Antagligen är vi i slänten bakom rollspelstälten, annars sätter vi en skylt vid ingången till hallen där det står var vi är. Om ni har något särskilt ni vill måla på, t ex en kylbox, en pannå eller vepa är det bara att ta med det.
    
