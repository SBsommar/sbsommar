event:
  id: nar-skolan-gor-ratt-goda-exempel-2026-08-01-1300
  title: När skolan gör rätt - goda exempel
  date: '2026-08-01'
  start: '13:00'
  end: '14:30'
  location: Kaffetält
  responsible: Kajsa Ögård
  description: |
    Få inspiration av goda exempel på skolsamarbete och anpassningar som fungerat. Föräldrafika (endast för vuxna).
    
    Jag börjar med att berätta om vår resa där vi gått från lågt förtroende till ett tätt och fungerande samarbete med en skola som tidigare inte alls jobbat med särskild begåvning utan där vi var först ut.
    
    Sedan hoppas jag att andra som har goda exempel vill dela med sig av dem, oavsett om det handlar om skolan som helhet eller ”det enda lilla som faktiskt blev bra”.
    
    Vi kör inga långa presentationsrundor så man kan hoppa in och ut om man inte kan vara med från början eller behöver gå tidigt. Bokar upp lite extra tid.
