  - id: bygg-med-ai-eller-ta-nasta-steg-1-2026-07-27-2000
    title: 'Bygg med AI - eller ta nästa steg (#1)'
    date: '2026-07-27'
    start: '20:00'
    end: '21:00'
    location: GA Stilla hyllan
    responsible: Jonas R
    description: |
      Det här är första träffen i en serie där vi utforskar vad man kan skapa med dagens AI. 

      Två huvudspår:
      **Bygga med AI**

      Vi börjar med att titta på några exempel på vad som går att bygga på kort tid (webbsidor/appar/spel) och kommer sedan igång med verktyg som Lovable och AI Studio (eller Claude Code/Antigravity/Codex eller liknande). Målet är att alla ska ha byggt eller börja byggt något innan passet är slut.

      **Ta ett steg till med din AI-användning**

      För dig som är sugen på att fördjupa dig i hur AI kan användas mer effektivt i vardagen och arbetet. Vi kan till exempel titta på bättre arbetssätt med chatbotar, anpassade instruktioner, MCP, skills, agenter och andra sätt att få AI att göra mer än att bara svara på frågor.

      De kommande träffarna fortsätter vi med dessa eller med nya byggprojekt, där vi testar idéer, utforskar verktyg och lär oss av varandra.

      Ta med en dator, dina idéer och din nyfikenhet. Kom med din kunskap, oavsett nivå, så bygger och lär vi tillsammans.
