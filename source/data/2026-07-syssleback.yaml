  - id: blood-on-the-clocktower-2026-07-29-1900
    title: Blood On The Clocktower
    date: '2026-07-30'
    start: '19:00'
    end: '22:00'
    location: Tält1
    responsible: Viktor Carlsson
    description: |
      Blood on the Clocktower är ett social deduction-spel, lite likt varulvar, maffia, secret hitler, etc... Ni känner säkert till något av de spelen, jag vet att det är många som spelar sånt på lägret. Hursomhelst skiljer det sig lite grann i att:
      - Alla spelare har en roll som uppfyller någon funktion
      - Man är fortfarande med i spelet även om man dö
      - Information kan vara sann eller inte, det å lista ut vad som faktiskt stämmer kan också vara en del av spelet.

      Jag skulle säga att det är likt maffia/varulvar fast lite mer komplext (men också mycket mer kul i min åsikt). 

      En runda kan ta ett par timmar beroende på vad som händer, och man behöver inga förkunskaper för att vara med (vi går igenom allt). I och med komplexiteten kanske jag hade rekommenderat det för något äldre målgrupper utan att kunna dra någon exakt åldersgräns.

      Spelet lämpar sig bäst på grupper mellan 8 och 15 personer.

      ANMÄLAN: https://forms.gle/xPX1wRhYseQtJySQA

    link: 'https://forms.gle/xPX1wRhYseQtJySQA'
