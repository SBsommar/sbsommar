    location: GA Stilla hyllan
    responsible: Jessica Malmberg
    description: |
      *Ändring dubbelpass*

      **Klar Challenge**
       Välj något du velat lära dig men aldrig kommit igång med, eller något du redan är nyfiken på och vill gå riktigt djupt i – ett skolämne, ett helt eget spår, vad som helst – och se hur långt du kommer med Klar på begränsad tid. Den som vill får avsluta med en kort presentation av vad man lyckats åstadkomma – helt frivilligt.

      Ta med din nyfikenhet, lite tävlingsanda, och gärna din egen laptop (mobil funkar också).

      **Vibecoding** Loveble
      Har du en idé för en app eller ett verktyg du velat bygga? Grundarna bakom Klar började med precis en sådan idé, i liten skala. Nu får du chansen att göra samma sak: bygga din egen idé med hjälp av AI, även om du aldrig kodat förut.

      Ta med din egen laptop om du har en – annars funkar mobilen bra. Ingen kodvana krävs, bara en idé du vill förverkliga.

