  - id: rollspel-johans-kampanj-1-natten-som-aldrig-vill-2026-07-27-1000
    title: 'Rollspel, Johans kampanj 1 – Natten som aldrig vill ta slut, Göra karaktärer'
    date: '2026-07-27'
    start: '10:00'
    end: '11:00'
    location: Rollspelstält2
    responsible: Johan Eellend
    description: |
      Vi kommer att använda spelsystemet från nya Drakar och Demoner, men förhålla oss lite fritt till både världen och regler. Det finns alltid platts för fantasi, egna idéer och förslag, så länge det inte stjälper spelet!
      För att få lite starkare karaktärer så kommer rollpersonerna få tre (3) extra tränade färdigheter från början. För magiker kan det bytas ut mot tre besvärjelser eller ytterligare en magiskola och två besvärjelser. Besvärjelserna kan också vara på en högre nivå.

      Äventyret kommer äga rum i en värld där samhället håller på att tappa greppet, där naturen och dolda krafter håller på att ta över. Resorna till lands och till sjöss kan bli långa. Strid och magi kan behövas på oväntade platser, men lalla hinder går inte att övervinna, så det finns alltid platts för list, övertalning och reträtt. 

      För er som kommer sent kommer det finnas möjlighet att göra karaktärer innan spelet drar i gång på måndag kväll. Att göra karaktärer till Drakar och Demoner går rätt fort, och inlevelse slår alltid siffror. 

    link: null
    cancelled: true
    owner:
      name: ''
      email: ''
    meta:
      created_at: 2026-07-23 19:34
      updated_at: 2026-07-25 07:55
      location_set_at: 2026-07-23 19:34
